# Render Blueprint — public HTTPS deployment of OBV.
# Deploy: render.com → New → Blueprint → connect this repo → Apply.
#
# Host selection (compatibility, not popularity):
# - OBV is ONE long-running node:http process using the built-in
#   node:sqlite and local-disk storage — it needs a real server process,
#   Node >= 22.5, and writable disk. Serverless platforms (Vercel/Netlify
#   functions) are architecturally incompatible: no long-lived process,
#   no persistent local writes, request time limits vs. PDF rendering.
# - PDF report generation needs headless Chromium + system libraries,
#   which Render's native Node runtime does not provide. The Docker
#   runtime below bakes Playwright + Chromium into the image, so reports
#   render as real PDFs in production. Render Docker works on the free
#   plan and terminates HTTPS automatically (required for phone camera
#   and geolocation APIs).
#
# Persistence:
# - Free plan disks are ephemeral: every restart/redeploy returns the demo
#   to its seeded state (the start command reseeds only when the database
#   file is missing — often acceptable, even desirable, for a demo).
# - For restart-safe state, upgrade the instance (disks need a paid plan),
#   uncomment the disk block below, and set OBV_DATA_DIR=/var/data.
services:
  - type: web
    name: obv-demo
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Optional access protection for the public demo. Set a value in the
      # Render dashboard (sync: false means Render prompts; leaving it
      # empty keeps the demo open).
      - key: OBV_ACCESS_CODE
        sync: false
      # Session signing key. generateValue makes Render mint a random
      # secret per service — nothing is committed, and sessions survive
      # restarts (an unset value would fall back to a per-boot ephemeral
      # key, silently signing everyone out on every deploy).
      - key: OBV_SESSION_SECRET
        generateValue: true
      # Optional integrations — set values in the Render dashboard only;
      # never commit them to the repository:
      #   ANTHROPIC_API_KEY   -> enables live AI visual verification
      #   TEAMS_WEBHOOK_URL   -> enables Microsoft Teams notifications
      #   OBV_PUBLIC_BASE_URL -> explicit public URL for Teams card links
      #                          (defaults to Render's RENDER_EXTERNAL_URL)
    # ---- persistent storage (requires a paid instance type) ----
    # disk:
    #   name: obv-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # ...and add:
    # envVars:
    #   - key: OBV_DATA_DIR
    #     value: /var/data

  # ---- EXTERNAL PILOT (real lender; SEPARATE from the public demo) ----
  # Uncomment to provision. REQUIREMENTS this blueprint cannot buy for
  # you: a PAID instance type (persistent disks are not available on the
  # free plan — the pilot cannot run on ephemeral storage) and Postmark
  # credentials entered in the dashboard. After the first deploy, run
  # `npm run pilot:check` in a shell on the service and fix every FAIL
  # before inviting the lender. Full sequence: docs/FIRST_LENDER_RUNBOOK.md
  #
  # - type: web
  #   name: obv-pilot
  #   runtime: docker
  #   plan: starter               # any PAID plan — required for the disk
  #   numInstances: 1             # ONE writer. SQLite on one disk: never scale this service.
  #   autoDeploy: false           # the pilot deploys ONLY via Manual Deploy, never on every push to main
  #   branch: main
  #   dockerfilePath: ./Dockerfile
  #   healthCheckPath: /api/ready # readiness, not liveness: deploys gate on it (configuration valid);
  #                               # `npm run pilot:check` gates TRAFFIC (posture, delivery, backups)
  #   disk:
  #     name: obv-pilot-data
  #     mountPath: /var/data
  #     sizeGB: 5
  #   envVars:
  #     - key: OBV_ENVIRONMENT
  #       value: pilot            # disables every demo surface at startup
  #     - key: OBV_DATA_DIR
  #       value: /var/data        # must equal disk.mountPath
  #     - key: OBV_SESSION_SECRET
  #       generateValue: true     # required at boot (refusal without it); minted once, kept stable
  #     - key: OBV_AUTH_LINK_DELIVERY
