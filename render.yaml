  #     - key: OBV_EMAIL_PROVIDER
  #       value: postmark
  #     - key: OBV_INTEGRATIONS_PRODUCTION_ENABLE
  #       value: "true"           # second explicit consent for a live vendor
  #     - key: OBV_POSTMARK_SERVER_TOKEN
  #       sync: false             # entered in the dashboard, never committed
  #     - key: OBV_EMAIL_FROM
  #       sync: false             # verified Postmark sender signature
